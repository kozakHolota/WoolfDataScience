services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    healthcheck:
      test: ["CMD", "bash", "-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks:
      - default

  spark-master:
    image: apache/spark:3.5.4
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master port
    volumes:
      - ./checkpoints:/checkpoints
    networks:
      - default

  spark-worker:
    image: apache/spark:3.5.4
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
    ports:
      - "8081:8081"   # Spark Worker Web UI
    volumes:
      - ./checkpoints:/checkpoints
    depends_on:
      - spark-master
    networks:
      - default

  spark-streaming:
    image: apache/spark:3.5.4
    container_name: spark-streaming
    user: root
    command:
      - bash
      - -c
      - |
        mkdir -p /home/spark/.ivy2/cache /home/spark/.ivy2/jars
        chown -R spark:spark /home/spark/.ivy2
        su spark -c '/opt/spark/bin/spark-submit --master spark://spark-master:7077 --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.4 --conf spark.streaming.stopGracefullyOnShutdown=true --conf spark.sql.streaming.checkpointLocation=/checkpoints /app/spark_utils/spark_streaming.py'
    volumes:
      - .:/app
      - ./checkpoints:/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started
    networks:
      - default

  kafka_consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kafka_consumer
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - default

volumes:
  kafka_data:

networks:
  default:
    name: kafka_network
